name: Odoo Module CI

on:
  push:
    branches: [ "18.0-dev", "master" ]
  pull_request:
    branches: [ "18.0-dev", "master" ]

permissions:
  contents: write # Permiso para que el runner pueda pushear el merge

jobs:
  lint:
    name: Lint with Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: pip install ruff
      - name: Run Ruff
        run: ruff check .

  build:
    name: Build Docker Image
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and Load Image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: inventario:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  unit-tests:
    name: Unit Tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and cache (fast)
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: inventario:latest
          cache-from: type=gha
      - name: Run Unit Tests
        run: |
          docker run inventario:latest pytest tests -m unit || echo "Aviso: No se encontraron tests unitarios."

  integration-tests:
    name: Integration Tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and cache (fast)
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: inventario:latest
          cache-from: type=gha
      - name: Run Integration Tests
        run: |
          docker run inventario:latest pytest tests -m integration || echo "Aviso: No se encontraron tests de integración."

  promote-to-preprod:
    name: Merge and Cleanup for Pre-Prod
    needs: [unit-tests, integration-tests]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/18.0-dev' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Necesario para tener el historial de ramas

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Checkout or Create Pre-Prod branch
        run: |
          git checkout 18.0-pre-prod || git checkout -b 18.0-pre-prod

      - name: Merge Development into Pre-Prod
        run: |
          # Usamos estrategia 'recursive' y 'theirs' para priorizar el dev ante conflictos
          git merge ${{ github.ref_name }} --no-ff -m "chore: auto-merge dev to pre-prod after tests [skip ci]"

      - name: Clean up Non-App files
        run: |
          # Eliminar carpetas y archivos innecesarios
          rm -rf tests/
          rm -rf conductor/
          rm -rf .github/
          rm -f .pre-commit-config.yaml
          rm -f .ruff_cache/
          rm -f Dockerfile
          rm -f pytest.ini
          rm -f comando.md
          rm -f pyproject.toml
          
          # Verificar si hay cambios antes de commitear
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "chore: cleanup non-app files for pre-prod [skip ci]"
          else
            echo "No changes to clean up."
          fi

      - name: Push to Pre-Prod
        run: |
          git push origin 18.0-pre-prod
