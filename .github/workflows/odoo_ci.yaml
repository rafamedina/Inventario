name: Odoo Module CI

on:
  push:
    branches: ["18.0-dev", "master"]
  pull_request:
    branches: ["18.0-dev", "master"]

permissions:
  contents: write

jobs:
  lint:
    name: Lint with Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: pip install ruff
      - name: Run Ruff
        run: ruff check .

  build:
    name: Build Docker Image
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and Load Image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: inventario:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  unit-tests:
    name: Unit Tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Run Unit Tests
        run: |
          echo "🚀 Starting Unit Tests..."
          # Usamos tee para ver la salida en vivo y guardarla en el log
          docker run inventario:latest pytest tests -m unit -v --tb=short --color=yes 2>&1 | tee /tmp/odoo_tests.log || true

      - name: Analyze Results
        if: always()
        run: |
          LOG="/tmp/odoo_tests.log"
          echo ""
          echo "═══════════════════════════════════════════════"
          echo "           UNIT TESTS FINAL SUMMARY"
          echo "═══════════════════════════════════════════════"
          if [ ! -f "$LOG" ]; then echo "❌ No log found"; exit 1; fi
          
          # Extraer el resumen final de pytest
          SUMMARY=$(grep -E "==.*passed.*==" "$LOG" | tail -1)
          if [ -n "$SUMMARY" ]; then
            echo "📊 $SUMMARY"
          else
            echo "📊 No summary line found. Check logs above."
          fi
          
          if grep -q "FAILED" "$LOG"; then
            echo "❌ FAILED TESTS DETECTED. See tracebacks above."
            exit 1
          else
            echo "✅ All unit tests passed successfully."
          fi

      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-logs
          path: /tmp/odoo_tests.log

  integration-tests:
    name: Integration Tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Run Integration Tests
        run: |
          echo "🚀 Starting Integration Tests..."
          docker run inventario:latest pytest tests -m integration -v --tb=short --color=yes 2>&1 | tee /tmp/odoo_tests.log || true

      - name: Analyze Results
        if: always()
        run: |
          LOG="/tmp/odoo_tests.log"
          echo ""
          echo "═══════════════════════════════════════════════"
          echo "         INTEGRATION TESTS FINAL SUMMARY"
          echo "═══════════════════════════════════════════════"
          if [ ! -f "$LOG" ]; then echo "❌ No log found"; exit 1; fi
          
          SUMMARY=$(grep -E "==.*passed.*==" "$LOG" | tail -1)
          if [ -n "$SUMMARY" ]; then
            echo "📊 $SUMMARY"
          fi
          
          if grep -q "FAILED" "$LOG"; then
            echo "❌ FAILED TESTS DETECTED. See tracebacks above."
            exit 1
          else
            echo "✅ All integration tests passed successfully."
          fi

      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-logs
          path: /tmp/odoo_tests.log

  promote-to-preprod:
    name: Merge and Cleanup for Pre-Prod
    needs: [unit-tests, integration-tests]
    if: github.event_name == 'push' && success() && (github.ref == 'refs/heads/18.0-dev' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Checkout or Create Pre-Prod branch
        run: git checkout 18.0-pre-prod || git checkout -b 18.0-pre-prod
      - name: Merge Development into Pre-Prod
        run: |
          git merge origin/${{ github.ref_name }} --no-ff -X theirs -m "chore: auto-merge dev to pre-prod after tests [skip ci]"
      - name: Clean up Non-App files
        run: |
          rm -rf tests/ conductor/ .github/
          rm -f .pre-commit-config.yaml .ruff_cache/ Dockerfile pytest.ini comando.md pyproject.toml .gitignore
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "chore: cleanup non-app files for pre-prod [skip ci]"
          fi
      - name: Push to Pre-Prod
        run: git push origin 18.0-pre-prod
