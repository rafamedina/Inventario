name: Odoo Module CI/CD Professional

on:
  push:
    branches: ["18.0-dev", "master"]
  pull_request:
    branches: ["18.0-dev", "master"]
  workflow_dispatch: # Enable manual execution for debugging

permissions:
  contents: read # Secure default: read-only access

jobs:
  lint:
    name: 🔍 Lint (Ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip" # Optimized caching for dependencies
      - name: Run Ruff
        run: |
          pip install ruff
          ruff check .

  build:
    name: 🐳 Build & Export Image
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Test Image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: test
          tags: inventario:latest
          outputs: type=docker,dest=/tmp/inventario.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: odoo-image
          path: /tmp/inventario.tar
          retention-days: 1

  unit-tests:
    name: 🔬 Unit Tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Download Image
        uses: actions/download-artifact@v4
        with:
          name: odoo-image
          path: /tmp
      - name: Load Image
        run: docker load < /tmp/inventario.tar
      - name: Run Pytest
        run: |
          echo "🚀 Creating temporary Odoo config..."
          cat <<EOF > /tmp/odoo_unit.conf
          [options]
          db_host = 127.0.0.1
          db_user = odoo
          db_password = odoo
          addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons
          EOF

          echo "🚀 Running unit tests with external DB..."
          docker run --rm --network host \
            -v /tmp/odoo_unit.conf:/tmp/odoo.conf \
            inventario:latest pytest /mnt/extra-addons/Inventario/tests -m unit -v --tb=short --color=yes \
            --odoo-config=/tmp/odoo.conf \
            --odoo-database=test_ci_unit \
            --odoo-addons-path=/usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons \
            2>&1 | tee /tmp/unit_tests.log || true
      - name: Analyze Results
        if: always()
        run: |
          LOG="/tmp/unit_tests.log"
          echo "═══════════════════════════════════════════════"
          echo "           UNIT TESTS FINAL SUMMARY"
          echo "═══════════════════════════════════════════════"
          grep -E "==.*passed.*==" "$LOG" || echo "📊 No summary found"
          if grep -q "FAILED" "$LOG" || grep -q "ERROR" "$LOG"; then exit 1; else echo "✅ PASSED"; fi
      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-logs
          path: /tmp/unit_tests.log

  integration-tests:
    name: 🌐 Integration Tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Download Image
        uses: actions/download-artifact@v4
        with:
          name: odoo-image
          path: /tmp
      - name: Load Image
        run: docker load < /tmp/inventario.tar
      - name: Run Pytest
        run: |
          echo "🚀 Creating temporary Odoo config..."
          cat <<EOF > /tmp/odoo_int.conf
          [options]
          db_host = 127.0.0.1
          db_user = odoo
          db_password = odoo
          addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons
          EOF

          echo "🚀 Running integration tests with external DB..."
          docker run --rm --network host \
            -v /tmp/odoo_int.conf:/tmp/odoo.conf \
            inventario:latest pytest /mnt/extra-addons/Inventario/tests -m integration -v --tb=short --color=yes \
            --odoo-config=/tmp/odoo.conf \
            --odoo-database=test_ci_int \
            --odoo-addons-path=/usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons \
            2>&1 | tee /tmp/int_tests.log || true
      - name: Analyze Results
        if: always()
        run: |
          LOG="/tmp/int_tests.log"
          echo "═══════════════════════════════════════════════"
          echo "         INTEGRATION TESTS FINAL SUMMARY"
          echo "═══════════════════════════════════════════════"
          grep -E "==.*passed.*==" "$LOG" || echo "📊 No summary found"
          if grep -q "FAILED" "$LOG" || grep -q "ERROR" "$LOG"; then exit 1; else echo "✅ PASSED"; fi
      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-logs
          path: /tmp/int_tests.log

  promote-to-preprod:
    name: 🔄 Sync & Clean Pre-Prod
    needs: [unit-tests, integration-tests]
    if: github.event_name == 'push' && success() && (github.ref == 'refs/heads/18.0-dev' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # Specific write permission for syncing branches
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Force Sync Pre-Prod
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B 18.0-pre-prod
          # Systematic cleanup of non-production files
          rm -rf tests/ conductor/ .github/ .ruff_cache/
          rm -f .gitignore .pre-commit-config.yaml Dockerfile pytest.ini pyproject.toml comando.md requirements.txt image.png
          git add -A
          git commit -m "chore: production-ready cleanup [skip ci]" || echo "No changes to commit"
          git push origin 18.0-pre-prod --force
