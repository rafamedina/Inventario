name: Odoo Module CI/CD Professional

on:
  push:
    branches: ["18.0-dev", "master"]
  pull_request:
    branches: ["18.0-dev", "master"]

permissions:
  contents: write

jobs:
  lint:
    name: 🔍 Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"
      - name: Run Ruff
        run: |
          pip install ruff
          ruff check .

  build:
    name: 🐳 Build & Export Image
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Test Image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: test
          tags: inventario:latest
          outputs: type=docker,dest=/tmp/inventario.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: odoo-image
          path: /tmp/inventario.tar
          retention-days: 1

  unit-tests:
    name: 🔬 Unit Tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Image
        uses: actions/download-artifact@v4
        with:
          name: odoo-image
          path: /tmp

      - name: Load Image into Docker
        run: docker load < /tmp/inventario.tar

      - name: Run Pytest (con pytest-odoo)
        run: |
          echo "🚀 Ejecutando tests unitarios..."
          # 💡 Definimos los parámetros de Odoo para que pytest-odoo inicialice el entorno
          docker run --rm inventario:latest pytest tests -m unit -v --tb=short --color=yes \
            --odoo-database=test_ci_unit \
            --odoo-addons-path=/usr/lib/python3/dist-packages/odoo/addons,. \
            2>&1 | tee /tmp/unit_tests.log || true

      - name: Analyze Results
        if: always()
        run: |
          LOG="/tmp/unit_tests.log"
          echo "═══════════════════════════════════════════════"
          echo "           UNIT TESTS FINAL SUMMARY"
          echo "═══════════════════════════════════════════════"
          if [ ! -f "$LOG" ]; then echo "❌ No log found"; exit 1; fi
          grep -E "==.*passed.*==" "$LOG" || echo "📊 No summary found"
          if grep -q "FAILED" "$LOG"; then exit 1; else echo "✅ PASSED"; fi

  integration-tests:
    name: 🌐 Integration Tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Image
        uses: actions/download-artifact@v4
        with:
          name: odoo-image
          path: /tmp

      - name: Load Image into Docker
        run: docker load < /tmp/inventario.tar

      - name: Run Pytest (con pytest-odoo)
        run: |
          echo "🚀 Ejecutando tests de integración..."
          # 💡 Los tests de integración necesitan Chrome, que ya está configurado en el Dockerfile
          docker run --rm inventario:latest pytest tests -m integration -v --tb=short --color=yes \
            --odoo-database=test_ci_int \
            --odoo-addons-path=/usr/lib/python3/dist-packages/odoo/addons,. \
            2>&1 | tee /tmp/int_tests.log || true

      - name: Analyze Results
        if: always()
        run: |
          LOG="/tmp/int_tests.log"
          echo "═══════════════════════════════════════════════"
          echo "         INTEGRATION TESTS FINAL SUMMARY"
          echo "═══════════════════════════════════════════════"
          if [ ! -f "$LOG" ]; then echo "❌ No log found"; exit 1; fi
          grep -E "==.*passed.*==" "$LOG" || echo "📊 No summary found"
          if grep -q "FAILED" "$LOG"; then exit 1; else echo "✅ PASSED"; fi

  promote-to-preprod:
    name: 🔄 Sync & Clean Pre-Prod
    needs: [unit-tests, integration-tests]
    if: github.event_name == 'push' && success() && (github.ref == 'refs/heads/18.0-dev' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Force Sync Pre-Prod
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B 18.0-pre-prod
          rm -rf tests/ conductor/ .github/
          rm -f .pre-commit-config.yaml .ruff_cache/ Dockerfile pytest.ini pyproject.toml comando.md
          git add -A
          git commit -m "chore: production-ready cleanup [skip ci]" || echo "Sin cambios"
          git push origin 18.0-pre-prod --force
