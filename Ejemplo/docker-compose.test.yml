## Entorno Efímero para Tests Locales
## Ejecuta TODOS los tests del módulo y se destruye. Sin persistencia.
##
## Uso:
##   ./scripts/run-tests.sh          → Todos los tests
##   ./scripts/run-tests.sh unit     → Solo unit tests
##   ./scripts/run-tests.sh int      → Solo integration tests
##
## Los tests se auto-descubren: cualquier test registrado en tests/__init__.py
## se ejecuta automáticamente sin necesidad de listar clases manualmente.
##
## AISLAMIENTO: Este compose usa el proyecto 'elearning-test', completamente
## separado del entorno de desarrollo ('elearning-dev'). Se pueden ejecutar en paralelo.

name: elearning-test

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_DB: postgres
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo"]
      interval: 3s
      timeout: 2s
      retries: 10

  odoo-test-unit:
    build:
      context: .
      dockerfile: Dockerfile
      target: test
    depends_on:
      db:
        condition: service_healthy
    command: >
      odoo
        --db_host=db
        --db_port=5432
        --db_user=odoo
        --db_password=odoo
        --addons-path=/usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons
        -d test_unit
        -i elearning_universidad
        --test-enable
        --stop-after-init
        --log-level=test
        --test-tags=/elearning_universidad,-/elearning_universidad:TestUiPortal,-/elearning_universidad:TestControllers
        --max-cron-threads=0

  odoo-test-integration:
    build:
      context: .
      dockerfile: Dockerfile
      target: test
    depends_on:
      db:
        condition: service_healthy
    environment:
      - ODOO_CHROME_TIMEOUT=120
    command: >
      odoo
        --db_host=db
        --db_port=5432
        --db_user=odoo
        --db_password=odoo
        --addons-path=/usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons
        -d test_integration
        -i elearning_universidad
        --test-enable
        --stop-after-init
        --log-level=test
        --test-tags=/elearning_universidad:TestUiPortal,/elearning_universidad:TestControllers
        --max-cron-threads=0
