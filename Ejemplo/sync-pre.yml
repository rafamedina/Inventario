name: 🔄 Auto-Sync Dev to Pre

on:
  push:
    branches: [dev]

jobs:
  sync-pre:
    name: 🧹 Sincronizar y Limpiar rama PRE
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_CLEANUP }}
          fetch-depth: 0 # Necesario para hacer checkout a otra rama

      - name: Sincronizar con PRE
        run: |
          # Configuramos git
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Hacemos checkout forzando que pre sea idéntico a dev (la rama actual)
          git checkout -B pre

          echo "🚀 Iniciando limpieza PROFUNDA de archivos de desarrollo para PRE..."

          # 1. Carpetas de Desarrollo
          rm -rf tests/
          rm -rf docs/
          rm -rf conductor/
          rm -rf scripts/
          rm -rf .github/

          # 2. Archivos Docker
          rm -f Dockerfile
          rm -f docker-compose.yml
          rm -f docker-compose.test.yml
          rm -f .dockerignore

          # 3. Configuraciones y Herramientas
          rm -f .pre-commit-config.yaml
          rm -f ruff.toml
          rm -f pyproject.toml
          rm -f TODO.md
          rm -f .gitignore

          echo "✅ Limpieza completada. Creando commit de release..."

          git add -A
          git commit -m "build: clean staging release [skip ci]" || echo "No hay cambios para hacer commit"

          # Hacemos push forzado a pre para que sea exactamente esta versión limpia
          git push origin pre --force
          echo "📦 Versión PURA de Odoo sincronizada en pre."
